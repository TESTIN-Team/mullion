# 构建说明(与 rimely 同一套已验证方案,工具经 junction 共享)
# - 产物目标 x86_64-pc-windows-msvc;本机无 VS/MSVC,链接用 rustc 自带 lld-link
#   + xwin splat 的系统导入库(tools/,目录 junction 指向 rimely 的工具,已 gitignore)
# - 选 MSVC target 的原因:egui 依赖链里的 windows-link 使用 raw-dylib,GNU target
#   上 rustc 需要外部 dlltool+as 组合(本机不可用),MSVC target 原生支持
# - 克隆后前置检查:ls tools/bin/lld-link.exe tools/xwin-splat/crt/lib/x86_64
#   缺失则先恢复工具链再构建
[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
linker = "tools/bin/lld-link.exe"
rustflags = [
    "-L", "native=tools/xwin-splat/crt/lib/x86_64",
    "-L", "native=tools/xwin-splat/sdk/lib/um/x86_64",
    "-L", "native=tools/xwin-splat/sdk/lib/ucrt/x86_64",
]

# 2026-10-10:本机 PATH 上出现了 WinGet 安装的 llvm-mingw(clang-23 垫片 gcc),
# 它接管了 GNU 宿主(build script)链接但没有 -lgcc 运行时。显式指回 rustup
# 自带的真实 x86_64-w64-mingw32-gcc。绝对路径是刻意的:本仓库已通过 tools/
# junction 与本机绑定(CI 宿主是 MSVC,不受此条影响)。
[target.x86_64-pc-windows-gnu]
linker = "C:/Users/rr/.rustup/toolchains/stable-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained/x86_64-w64-mingw32-gcc.exe"
